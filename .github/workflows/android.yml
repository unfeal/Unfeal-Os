name: Android build
on:
  push:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: sdkmanager "platforms;android-36"
      - run: gradle -p mobile assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: unfeal-mobile-debug
          path: mobile/app/build/outputs/apk/debug/*.apk
